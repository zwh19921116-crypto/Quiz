<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>End User License Agreement (EULA)</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=DM+Serif+Display:ital@0;1&display=swap");

    :root {
      --bg-a: #f8fafc;
      --bg-b: #eaf2f9;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #475569;
      --accent: #155e75;
      --line: #d7e5f1;
      --shadow: 0 22px 50px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Nunito", "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 100% 0, #ffffff 0%, var(--bg-a) 48%, var(--bg-b) 100%);
      min-height: 100vh;
      padding: 28px 14px;
    }

    .shell {
      max-width: 920px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 26px;
    }

    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.8rem;
    }

    h1 {
      margin: 8px 0 14px;
      font-family: "DM Serif Display", Georgia, serif;
      font-size: clamp(1.7rem, 4vw, 2.4rem);
      font-weight: 400;
    }

    .content {
      display: grid;
      gap: 12px;
      color: #1e293b;
      line-height: 1.65;
      font-weight: 600;
    }

    .content p {
      margin: 0;
      padding: 10px 12px;
      background: #f7fbff;
      border: 1px solid #dbe8f4;
      border-radius: 10px;
    }

    .footer {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <p class="eyebrow">Legal</p>
      <h1>End User License Agreement (EULA)</h1>
      <div id="legalContent" class="content"></div>
      <p class="footer">This page is sourced from eula.txt so content can be updated at any time.</p>
    </section>
  </main>

  <script>
    async function loadEula() {
      const host = document.getElementById("legalContent");
      const fallback = [
        "This software and quiz content are licensed, not sold.",
        "You are granted a limited, non-exclusive, non-transferable license to use this quiz for learning purposes.",
        "You may not reverse engineer, redistribute, or create derivative works unless explicitly permitted."
      ];

      try {
        const response = await fetch("eula.txt", { cache: "no-store" });
        if (!response.ok) throw new Error("Could not load EULA file.");
        const raw = await response.text();
        const lines = raw
          .split(/\r?\n\s*\r?\n/g)
          .map((line) => line.trim())
          .filter((line) => line !== "");
        const content = lines.length > 0 ? lines : fallback;
        host.innerHTML = content.map((line) => `<p>${line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")}</p>`).join("");
      } catch (error) {
        host.innerHTML = fallback.map((line) => `<p>${line}</p>`).join("");
      }
    }

    loadEula();
  </script>
</body>
</html>
