name: Update build timestamp

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp viewer.js with current UTC datetime
        run: |
          TS=$(date -u +"%Y-%m-%d %H:%M")
          sed -i "1s/.*/const VIEWER_LAST_MODIFIED = \"${TS}\";/" viewer.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "No changes" && exit 0
          git add viewer.js
          git commit -m "chore: update build timestamp [skip ci]"
          git push
