<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Viewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="container viewer-container">
      <div class="page-header page-header-split" style="position:relative;">
        <div class="page-header-main">
          <p class="eyebrow">Learning Assessment</p>
          <h1 id="quizTitle">Quiz Viewer</h1>
          <p id="quizDescription" class="quiz-description hidden"></p>
        </div>
        <div class="logo-placeholder" aria-label="Logo placeholder">
          <img
            class="logo-image"
            src="assets/logo.png"
            alt="Quiz logo"
            onload="this.style.display='block'; this.nextElementSibling.style.display='none'; this.parentElement.classList.remove('is-empty');"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex'; this.parentElement.classList.add('is-empty');"
          />
          <span class="logo-fallback">Add Logo</span>
        </div>
      </div>

      <div class="progress-row">
        <span id="progressText">Question 1 of 1</span>
        <span id="difficultyText" style="display: none;">Difficulty: 5/10</span>
        <span id="scoreText">Score: 0</span>
        <div class="progress-row-actions">
          <button class="btn secondary report-icon-btn" id="reportQuestionBtn" type="button" aria-label="Report Incorrect Answer" title="Report Incorrect Answer" data-tooltip="Report Incorrect Answer">⚑</button>
          <button class="btn secondary" id="shareQuizLinkBtn" type="button">Share Quiz Link</button>
        </div>
      </div>

      <div class="viewer-progress-track">
        <div id="viewerProgressFill" class="viewer-progress-fill"></div>
      </div>

      <div id="quizContainer"></div>

      <div class="viewer-meta-row">
        <button class="btn secondary" id="notesViewerBtn" type="button" style="display: none;">Notes</button>
        <div id="notesViewerPanel" class="viewer-notes-panel hidden"></div>
      </div>

      <div class="button-group viewer-actions" id="viewerActionBar">
        <button class="btn" id="checkAnswerBtn">Check Answer</button>
        <button class="btn secondary hidden" id="showSolutionBtn" type="button">Show Solution</button>
        <button class="btn secondary" id="nextQuestionBtn" disabled>Next Question</button>
      </div>

      <div id="resultBox"></div>
    </div>
  </div>

  <button class="question-nav-tab hidden" id="questionNavTab" type="button" aria-controls="questionNavPanel" aria-expanded="false">Questions</button>
  <aside class="question-nav-panel hidden" id="questionNavPanel" aria-hidden="true">
    <div class="question-nav-header">
      <h3>Question Navigator</h3>
      <button class="icon-btn" id="closeQuestionNavBtn" type="button" aria-label="Close question navigator">×</button>
    </div>
    <div class="question-nav-tabs" id="questionNavFilters">
      <button class="question-nav-filter is-active" data-filter="all" type="button">All</button>
      <button class="question-nav-filter" data-filter="unanswered" type="button">Unanswered</button>
      <button class="question-nav-filter" data-filter="answered" type="button">Answered</button>
    </div>
    <p class="question-nav-meta" id="questionNavMeta">No questions loaded.</p>
    <div class="question-nav-list" id="questionNavList"></div>
    <div class="question-nav-footer">
      <button class="btn secondary small" id="questionNavPrevBtn" type="button">Previous</button>
      <button class="btn secondary small" id="questionNavNextBtn" type="button">Next</button>
    </div>
  </aside>

  <div id="solutionModal" class="viewer-modal hidden" aria-hidden="true">
    <div class="viewer-modal-backdrop" data-close-solution="true"></div>
    <div class="viewer-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="solutionModalTitle">
      <div class="viewer-modal-header">
        <h2 id="solutionModalTitle">Solution</h2>
        <button class="icon-btn" id="closeSolutionBtn" type="button" aria-label="Close solution">×</button>
      </div>
      <div id="solutionModalBody" class="viewer-modal-body"></div>
      <div class="viewer-modal-footer">
        <button class="btn secondary" id="solutionNextBtn" type="button">Next Question</button>
      </div>
    </div>
  </div>

  <script src="viewer.js?v=20260606-2"></script>
</body>
</html>
